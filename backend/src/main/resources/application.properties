server.port=8080

# Database Configuration
spring.datasource.url=jdbc:h2:mem:ai_document_assistant;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini API Key (Can be overridden by environment variable GEMINI_API_KEY)
gemini.api.key=${GEMINI_API_KEY:AIzaSyCrj9EWIXLiJ1fHBcTnIs7_9Q4qfHepBd0}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Document Assistant</h1>
            <p>Upload a document. Let AI understand it.</p>
        </header>

        <main>
            <section class="upload-card">
                <div class="upload-area" id="upload-area">
                    <div class="upload-icon">📄</div>
                    <p>Drag & Drop Document</p>
                    <p class="or-text">or</p>
                    <label for="file-input" class="btn primary-btn">Browse Files</label>
                    <input type="file" id="file-input" accept=".txt,.pdf,.docx" hidden>
                    <p class="support-text">Supported: PDF • DOCX • TXT (Max 10MB)</p>
                </div>
                
                <div id="upload-status" class="status-message hidden">
                    <!-- Status updates will appear here -->
                </div>
            </section>

            <section class="recent-documents">
                <h2>Recent Documents</h2>
                <div class="table-container">
                    <table id="documents-table">
                        <thead>
                            <tr>
                                <th>Document</th>
                                <th>Type</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="documents-body">
                            <!-- Dynamic rows -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
